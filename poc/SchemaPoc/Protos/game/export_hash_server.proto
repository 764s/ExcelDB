// 仅供 Program 自检:与 export_hash_client.proto 只差导出 target。
syntax = "proto3";

package game.exporthash;

import "exceldb/options.proto";

message HashProbe {
  option (exceldb.table) = { kind: ASSET, id: 990, export_targets: { ids: "server" } };
  string id = 1 [(exceldb.field) = { key: 1 }];
  int32 value = 2;
}
