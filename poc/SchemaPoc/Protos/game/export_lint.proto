// 仅供 Program 自检:集中触发 export target 声明与闭包 lint。
syntax = "proto3";

package game.exportlint;

import "exceldb/options.proto";

message ClientOnlyTarget {
  option (exceldb.table) = { kind: ASSET, id: 991, export_targets: { ids: "client" } };
  string id = 1 [(exceldb.field) = { key: 1 }];
}

message BrokenDeclaration {
  option (exceldb.table) = {
    kind: ASSET,
    id: 992,
    export: EXPORT_ALL,
    export_targets: { ids: "client" }
  };

  string id = 1 [(exceldb.field) = { key: 1 }];
  string duplicate_target = 2 [(exceldb.field) = { export_targets: { ids: ["client", "client"] } }];
  string unknown_target = 3 [(exceldb.field) = { export_targets: { ids: "mobile" } }];
  string outside_table = 4 [(exceldb.field) = { export_targets: { ids: "server" } }];
  string conflicting_field = 5 [(exceldb.field) = { export: EDITOR_ONLY, export_targets: { ids: "client" } }];
}

message BrokenKey {
  option (exceldb.table) = { kind: ASSET, id: 993 };
  string id = 1 [(exceldb.field) = { key: 1, export_targets: { ids: "client" } }];
}

message BrokenReference {
  option (exceldb.table) = { kind: ASSET, id: 994, export_targets: { ids: "server" } };
  string id = 1 [(exceldb.field) = { key: 1 }];
  exceldb.RowRef client_target = 2 [(exceldb.field) = { ref_table: "ClientOnlyTarget" }];
}
