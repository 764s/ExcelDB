name: Release Windows CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-cli:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExcelDB.slnx

      - name: Test
        run: dotnet test ExcelDB.slnx -c Release --no-restore

      - name: Publish single-file CLI
        run: >-
          dotnet publish src/ExcelDB.Cli/ExcelDB.Cli.csproj
          -c Release
          -p:PublishProfile=win-x64
          -o artifacts/exceldb-win-x64

      - name: Package download
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath artifacts/exceldb-win-x64/exceldb.exe `
            -DestinationPath artifacts/exceldb-win-x64.zip `
            -Force
          $hash = (Get-FileHash artifacts/exceldb-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  exceldb-win-x64.zip" | Set-Content artifacts/exceldb-win-x64.zip.sha256 -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: exceldb-win-x64
          path: |
            artifacts/exceldb-win-x64.zip
            artifacts/exceldb-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/exceldb-win-x64.zip `
            artifacts/exceldb-win-x64.zip.sha256 `
            --verify-tag `
            --title "ExcelDB ${{ github.ref_name }}" `
            --generate-notes
