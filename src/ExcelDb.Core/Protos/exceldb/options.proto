// ExcelDb schema protocol: custom options carried by table .proto files,
// plus the reference value types that flow through cells and memory.
syntax = "proto3";

package exceldb;

import "google/protobuf/descriptor.proto";

option csharp_namespace = "ExcelDb.Protocol";

// ---------------------------------------------------------------------------
// Value types
// ---------------------------------------------------------------------------

// Reference to a row: (stable table number, per-table auto-increment id).
// Human surfaces render it as "TableName#id".
message RowRef {
  int32 table = 1;
  int32 id = 2;
}

// Undifferentiated reference to an external resource (Unity asset, FMOD event...).
// The database only routes by scheme; it never interprets the id.
message ExternalRef {
  string scheme = 1;
  string id = 2;
}

// ---------------------------------------------------------------------------
// Table / field options
// ---------------------------------------------------------------------------

enum TableKind {
  TABLE_KIND_UNSPECIFIED = 0;
  // One row = one identifiable asset (ScriptableObject replacement).
  ASSET = 1;
  // Pure data shape, only embedded inside other rows; no identity.
  EMBEDDED = 2;
}

message TableOptions {
  TableKind kind = 1;
  // Stable table number, hand-assigned like proto field numbers.
  // Persists in wire/bake form; must never change once data exists.
  int32 id = 2;
  // Named reference groups this table belongs to (self-registering).
  repeated string implements = 3;
}

message MetaEntry {
  string key = 1;
  string value = 2;
}

extend google.protobuf.MessageOptions {
  TableOptions table = 50001;
}

extend google.protobuf.FieldOptions {
  // Marks a business-key segment; value is the 1-based segment order.
  int32 key = 50011;
  // RowRef constraint: fixed target table (cells may store bare ids).
  string ref_table = 50012;
  // RowRef constraint: named group (cells must store "Table#id").
  string ref_group = 50013;
  // Layout hint for the xlsx column planner (e.g. "pack", "indexed:4").
  string layout = 50014;
  // Free-form metadata consumed by project extensions (validators, drawers...).
  repeated MetaEntry meta = 50015;
}
