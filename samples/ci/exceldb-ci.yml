name: ExcelDB validation

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair IDE system proto mirror
        shell: pwsh
        run: .\tools\exceldb.exe project repair-imports
      - name: Validate schema projection
        shell: pwsh
        run: .\tools\exceldb.exe schema build --check --json .\.exceldb\reports\schema-check.json
      - name: Validate workbooks
        shell: pwsh
        run: .\tools\exceldb.exe check --json .\.exceldb\reports\workbook-check.json
      - name: Convert client
        shell: pwsh
        run: .\tools\exceldb.exe convert --target client --json .\.exceldb\reports\convert-client.json
      - name: Convert server
        shell: pwsh
        run: .\tools\exceldb.exe convert --target server --json .\.exceldb\reports\convert-server.json
      - name: Upload target-scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exceldb-evidence
          path: |
            .exceldb/reports/*.json
            Generated/Bytes/**/*.bytes
            Generated/Bytes/**/*.manifest.json
